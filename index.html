<style>
:root{
  --bg:      #15131c;
  --panel:   #1c1926;
  --raised:  #232032;
  --rule:    #322d42;
  --text:    #d9d4e4;
  --dim:     #7d7591;
  --faint:   #55506a;
  --pass:    #57d16c;
  --warn:    #e0b341;
  --fail:    #f0616d;
  --info:    #74b3ff;
  --cake:    #f778ba;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --ui:   "Archivo", system-ui, -apple-system, sans-serif;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--mono);
  font-size:13px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  padding:24px 16px 64px;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(1100px 600px at 50% -8%, rgba(247,120,186,.07), transparent 70%);
}

.shell{max-width:1080px;margin:0 auto;position:relative;z-index:1}

/* ── header bar ─────────────────────────────────────────── */
.bar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  border:1px solid var(--rule);border-bottom:0;
  background:var(--panel);
  border-radius:8px 8px 0 0;
  padding:12px 16px;
}
.repo{font-weight:700;letter-spacing:-.2px}
.repo span{color:var(--dim);font-weight:400}
.jobno{color:var(--faint)}
.badge{
  font-family:var(--ui);font-size:10.5px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;
  padding:3px 9px;border-radius:99px;
  border:1px solid currentColor;
}
.badge.running{color:var(--warn)}
.badge.passed{color:var(--pass)}
.bar .clock{margin-left:auto;color:var(--faint);font-variant-numeric:tabular-nums}

/* ── stage rail ─────────────────────────────────────────── */
.rail{
  display:flex;align-items:center;gap:0;flex-wrap:wrap;
  border:1px solid var(--rule);border-bottom:0;
  background:var(--raised);padding:14px 16px;
}
.stage{display:flex;align-items:center;gap:8px;color:var(--faint);transition:color .3s}
.stage.active{color:var(--warn)}
.stage.done{color:var(--pass)}
.stage-name{font-family:var(--ui);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.dot{
  width:15px;height:15px;border-radius:50%;
  border:1.5px solid currentColor;
  display:grid;place-items:center;font-size:9px;flex:none;
}
.stage.active .dot{border-style:dashed;animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.link{
  flex:1;min-width:18px;height:1px;background:var(--rule);
  margin:0 12px;
}
.link.lit{background:var(--pass)}

/* ── main grid ──────────────────────────────────────────── */
.grid{display:grid;grid-template-columns:1fr 236px;border:1px solid var(--rule);border-radius:0 0 8px 8px;overflow:hidden}

/* ── log ────────────────────────────────────────────────── */
.log{
  background:#100e17;padding:18px 18px 12px;
  min-height:400px;max-height:60vh;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:var(--rule) transparent;
}
.log::-webkit-scrollbar{width:8px}
.log::-webkit-scrollbar-thumb{background:var(--rule);border-radius:8px}
.ln{display:flex;gap:14px;white-space:pre-wrap;word-break:break-word;animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.ts{color:#3b3650;flex:none;font-variant-numeric:tabular-nums;user-select:none}
.tx{flex:1;min-width:0}
.c-cmd{color:#fff;font-weight:500}
.c-dim{color:var(--dim)}
.c-pass{color:var(--pass)}
.c-warn{color:var(--warn)}
.c-fail{color:var(--fail)}
.c-info{color:var(--info)}
.c-cake{color:var(--cake)}
.c-head{color:var(--text);font-weight:700}
.sec{
  color:var(--faint);font-family:var(--ui);font-size:10.5px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;
  margin:18px 0 8px;padding-top:12px;border-top:1px solid #221f2e;
}
.sec:first-child{margin-top:0;padding-top:0;border-top:0}

/* ── meta sidebar ───────────────────────────────────────── */
.meta{background:var(--panel);border-left:1px solid var(--rule);padding:18px 16px}
.meta h3{
  font-family:var(--ui);font-size:10px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--faint);margin:0 0 10px;
}
.meta h3+h3{margin-top:24px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:12px}
.kv dt{color:var(--dim)}
.kv dd{margin:0;text-align:right;color:var(--text)}
.art{
  display:flex;align-items:center;gap:8px;font-size:12px;padding:6px 0;
  color:var(--faint);
}
.art.ready{color:var(--cake)}

/* ── the reveal ─────────────────────────────────────────── */
.reveal{
  margin-top:22px;border:1px solid var(--rule);border-radius:8px;
  background:linear-gradient(180deg,#1d1526,#171320);
  padding:34px 24px 28px;text-align:center;
  opacity:0;transform:translateY(14px);
  transition:opacity .7s ease,transform .7s ease;
}
.reveal.up{opacity:1;transform:none}
.cake{
  font-size:12px;line-height:1.25;color:var(--cake);
  display:inline-block;text-align:left;margin-bottom:8px;
  white-space:pre;
}
.flame{color:var(--warn);animation:flick 1.5s ease-in-out infinite}
.flame:nth-child(2){animation-delay:.35s}
.flame:nth-child(3){animation-delay:.7s}
@keyframes flick{0%,100%{opacity:1}50%{opacity:.45}}
.reveal h1{
  font-family:var(--ui);font-size:clamp(26px,6.5vw,46px);font-weight:700;
  letter-spacing:-.03em;margin:14px 0 4px;color:#fff;
}
.reveal .sub{color:var(--dim);font-size:12px;margin-bottom:26px}
.note{
  max-width:520px;margin:0 auto;text-align:left;
  border-left:2px solid var(--cake);padding:2px 0 2px 18px;
  color:var(--text);white-space:pre-wrap;
}

/* ── interactive prompt ─────────────────────────────────── */
.term{
  margin-top:22px;border:1px solid var(--rule);border-radius:8px;
  background:#100e17;overflow:hidden;
  opacity:0;transition:opacity .6s ease .3s;
}
.term.up{opacity:1}
.term-bar{
  background:var(--panel);border-bottom:1px solid var(--rule);
  padding:8px 14px;font-family:var(--ui);font-size:10.5px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
}
.term-body{padding:16px 18px;max-height:340px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
.term-body::-webkit-scrollbar{width:8px}
.term-body::-webkit-scrollbar-thumb{background:var(--rule);border-radius:8px}
.term-out{white-space:pre-wrap;word-break:break-word;margin-bottom:2px}
.row{display:flex;gap:8px;align-items:baseline;margin-top:6px}
.ps1{color:var(--pass);flex:none;user-select:none}
.ps1 b{color:var(--info);font-weight:400}
#cmd{
  flex:1;min-width:0;background:none;border:0;outline:0;padding:0;
  color:#fff;font-family:var(--mono);font-size:13px;caret-color:var(--cake);
}

/* ── skip ───────────────────────────────────────────────── */
.skip{
  position:fixed;right:18px;bottom:18px;z-index:5;
  background:var(--raised);color:var(--dim);
  border:1px solid var(--rule);border-radius:99px;
  font-family:var(--ui);font-size:11px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;padding:9px 18px;cursor:pointer;
  transition:color .2s,border-color .2s;
}
.skip:hover{color:var(--cake);border-color:var(--cake)}
.skip:focus-visible,#cmd:focus-visible{outline:2px solid var(--cake);outline-offset:3px}
.skip.gone{display:none}

/* ── confetti ───────────────────────────────────────────── */
.bit{position:fixed;top:-12px;width:6px;height:11px;z-index:4;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(104vh) rotate(680deg);opacity:0}}

@media (max-width:760px){
  body{padding:14px 10px 56px;font-size:12px}
  .grid{grid-template-columns:1fr}
  .meta{border-left:0;border-top:1px solid var(--rule)}
  .log{max-height:none;min-height:300px}
  .link{margin:0 7px}
  .ts{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

<script>
const C = CONFIG;
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $  = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

const STAGES = ["build","test","security-scan","deploy"];
let t = 0, done = false;

/* ── build the stage rail ───────────────────────────────── */
$("rail").innerHTML = STAGES.map((s,i) =>
  (i ? `<div class="link" id="lk${i}"></div>` : "") +
  `<div class="stage" id="st${i}"><span class="dot">✓</span><span class="stage-name">${s}</span></div>`
).join("");

/* ── the script ─────────────────────────────────────────── */
const L = [];
const say  = (tx, cls="", dt=1) => L.push({tx, cls, dt});
const head = tx => L.push({sec:tx});

head("stage: build");
say(`$ docker build -t birthday:${C.age} --build-arg SINCE=${C.friendsSince} .`, "c-cmd", 2);
say(`Sending build context to Docker daemon  ${C.age * 3.7 | 0}.4MB`, "c-dim");
say(`Step 1/4 : FROM friendship:${new Date().getFullYear() - C.friendsSince}y-stable`, "", 2);
say(` ---> Using cache`, "c-dim");
say(`Step 2/4 : RUN add-year --to=${C.handle} --force`, "");
say(` ---> ${C.age - 1} → ${C.age}`, "c-info", 2);
say(`Step 3/4 : COPY ./memories /var/lib/us`, "");
say(`Step 4/4 : LABEL maintainer="${C.yourName}"`, "", 2);
say(`Successfully tagged birthday:${C.age}`, "c-pass", 3);

head("stage: test");
say(`$ pytest -v tests/`, "c-cmd", 2);
say(`test_brightens_the_room ............................. PASSED`, "c-pass");
say(`test_shows_up_when_it_counts ........................ PASSED`, "c-pass");
say(`test_wins_mid_without_gloating ...................... PASSED`, "c-pass");
say(`test_refuses_one_more_eatery ........................ SKIPPED`, "c-warn", 2);
say(`  ↳ cannot test: has never once refused`, "c-dim");
say(`test_still_queues_after_9_years ..................... PASSED`, "c-pass", 2);
say(`4 passed, 1 skipped in 0.0${C.age}s`, "c-pass", 3);

head("stage: security-scan");
say(`$ trivy fs --scanners vuln,secret . && semgrep --config=auto`, "c-cmd", 2);
say(`Scanning ${C.handle}/ ...`, "c-dim", 3);
C.findings.forEach(f => {
  const cls = f.sev === "CRITICAL" || f.sev === "HIGH" ? "c-fail"
            : f.sev === "MEDIUM" ? "c-warn" : "c-dim";
  say(`[${f.sev}] ${f.text}`, cls, 2);
});
say(``, "", 1);
say(`${C.findings.length} findings. Risk accepted by ${C.yourName}. Proceeding anyway.`, "c-warn", 3);

head("stage: deploy");
say(`$ terraform apply -auto-approve`, "c-cmd", 2);
say(`Terraform will perform the following actions:`, "c-dim");
say(`  + resource "birthday_wish" "${C.handle}" {`, "c-pass");
say(`      + age       = ${C.age}`, "c-pass");
say(`      + sender    = "${C.yourName}"`, "c-pass");
say(`      + sincerity = 100`, "c-pass");
say(`    }`, "c-pass", 2);
say(`Plan: 1 to add, 0 to change, 0 to destroy.`, "", 2);
say(`birthday_wish.${C.handle}: Creation complete after ${C.age}s`, "c-pass", 3);
say(`$ kubectl rollout status deploy/${C.handle}-${C.age}`, "c-cmd", 2);
say(`deployment "${C.handle}-${C.age}" successfully rolled out`, "c-pass", 2);
say(`$ curl -s https://${C.handle}.local/healthz`, "c-cmd", 2);
say(`{"status":"alive","age":${C.age},"vibes":"immaculate"}`, "c-info", 3);
say(``, "", 1);
say(`NOTICE: v10.0.0 major release scheduled for September 2027.`, "c-cake", 2);
say(`        Nine years in. One to go. Plan accordingly.`, "c-cake", 3);
say(``, "", 1);
say(`Uploading artifact: birthday-wish.txt`, "c-cake", 2);
say(`Job succeeded ✓`, "c-pass", 1);

/* ── playback ───────────────────────────────────────────── */
const log = $("log");
const pad = n => String(n).padStart(2,"0");
const stamp = () => pad(t/60|0) + ":" + pad(t%60);

let stage = -1;
function enterStage(i){
  if (stage >= 0){
    $("st"+stage).className = "stage done";
    if ($("lk"+(stage+1))) $("lk"+(stage+1)).classList.add("lit");
  }
  stage = i;
  $("st"+i).className = "stage active";
}

function emit(item){
  if (item.sec){
    const i = STAGES.indexOf(item.sec.replace("stage: ",""));
    if (i > -1) enterStage(i);
    const d = document.createElement("div");
    d.className = "sec"; d.textContent = item.sec;
    log.appendChild(d);
  } else {
    t += item.dt;
    const d = document.createElement("div");
    d.className = "ln";
    d.innerHTML = `<span class="ts">${stamp()}</span><span class="tx ${item.cls}">${esc(item.tx) || "&nbsp;"}</span>`;
    log.appendChild(d);
    $("clock").textContent = stamp();
  }
  log.scrollTop = log.scrollHeight;
}

let idx = 0, timer = null;
function tick(){
  if (idx >= L.length) return finish();
  const item = L[idx++];
  emit(item);
  const wait = item.sec ? 420 : (item.cls === "c-cmd" ? 330 : 55 + Math.random()*95);
  timer = setTimeout(tick, wait);
}

function finish(){
  if (done) return;
  done = true;
  clearTimeout(timer);
  $("st3").className = "stage done";
  if ($("lk3")) $("lk3").classList.add("lit");
  $("badge").className = "badge passed";
  $("badge").textContent = "passed";
  $("m-dur").textContent = stamp();
  $("m-art").className = "art ready";
  $("m-art").textContent = "↓ birthday-wish.txt";
  $("skip").classList.add("gone");
  $("reveal").classList.add("up");
  $("term").classList.add("up");
  if (!RM) confetti();
  setTimeout(() => $("reveal").scrollIntoView({behavior: RM ? "auto" : "smooth", block:"center"}), 260);
}

$("skip").addEventListener("click", () => {
  clearTimeout(timer);
  while (idx < L.length) emit(L[idx++]);
  finish();
});

/* ── static bits ────────────────────────────────────────── */
$("jobno").textContent  = C.age;
$("m-by").textContent   = C.yourName;
$("m-sha").textContent  = C.commits[C.commits.length-1].hash === "HEAD"
                            ? "b1rthd4y" : C.commits[C.commits.length-1].hash;
$("m-author").textContent = C.yourName;
$("ps-user").textContent  = C.handle;
$("hbd").textContent      = `Happy ${C.age}th, ${C.name}`;
$("sub").textContent      = `deployed to production by ${C.yourName} · ${new Date().getFullYear()}`;
$("note").textContent     = C.message.join("\n");
$("cakeart").innerHTML =
`      <span class="flame">(</span>   <span class="flame">(</span>   <span class="flame">(</span>
      |   |   |
 _____|___|___|_____
|  ~~~~~~~~~~~~~~~  |
|___________________|
/_____________________\\`;

/* ── confetti ───────────────────────────────────────────── */
function confetti(){
  const cols = ["#f778ba","#57d16c","#e0b341","#74b3ff","#d9d4e4"];
  for (let i=0;i<70;i++){
    const b = document.createElement("div");
    b.className = "bit";
    b.style.left = Math.random()*100 + "vw";
    b.style.background = cols[i % cols.length];
    b.style.animationDuration = (2.6 + Math.random()*2.2) + "s";
    b.style.animationDelay = (Math.random()*.9) + "s";
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 6200);
  }
}

/* ── interactive shell ──────────────────────────────────── */
const tbody = $("tbody"), cmd = $("cmd");
const hist = []; let hp = 0;

function out(text, cls=""){
  const d = document.createElement("div");
  d.className = "term-out " + cls;
  d.innerHTML = text;
  tbody.insertBefore(d, tbody.lastElementChild);
  tbody.scrollTop = tbody.scrollHeight;
}

const CMDS = {
  help: () => out(
`Available commands:

  <span class="c-cake">whoami</span>          identify yourself
  <span class="c-cake">cat wish.txt</span>    the actual message
  <span class="c-cake">git log</span>         commit history of this friendship
  <span class="c-cake">uptime</span>          how long you've been running

  <span class="c-cake">clear</span>           clean slate

Not everything is listed. Try the things you'd actually type —
places we've been, games we've played, songs you've ruined.`),

  whoami: () => out(`${esc(C.handle)}\n<span class="c-dim">uid=${C.age}(${esc(C.name)}) groups=friends,devops,sleep-deprived</span>`),

  ls: () => out(`<span class="c-info">wish.txt</span>  <span class="c-info">northern-areas.md</span>  <span class="c-info">lahore.md</span>  <span class="c-dim">.secrets</span>  <span class="c-dim">todo-someday.md</span>`),

  "cat wish.txt": () => out(`<span class="c-cake">${esc(C.message.join("\n"))}</span>`),

  clear: () => { [...tbody.querySelectorAll(".term-out")].forEach(n => n.remove()); },

${esc(C.handle)}-${C.age}${" ".repeat(Math.max(1, 22 - C.handle.length - String(C.age).length))}1/1     <span class="c-pass">Running</span>   ${C.age}          ${C.age}y`),
};

function run(raw){
  const q = raw.trim();
  if (!q) return;
  out(`<span class="ps1">${esc(C.handle)}@prod:~$</span> ${esc(q)}`);
  const key = q.toLowerCase().replace(/\s+/g," ");
  const fn = CMDS[key] || CMDS[key.replace(/^cat\s+/,"cat ")];
  if (fn) fn();
  else out(`<span class="c-fail">${esc(q.split(" ")[0])}: command not found</span> <span class="c-dim">— try 'help'</span>`);
}

cmd.addEventListener("keydown", e => {
  if (e.key === "Enter"){
    const v = cmd.value;
    if (v.trim()){ hist.push(v); hp = hist.length; }
    run(v); cmd.value = "";
  } else if (e.key === "ArrowUp"){
    e.preventDefault();
    if (hp > 0) cmd.value = hist[--hp];
  } else if (e.key === "ArrowDown"){
    e.preventDefault();
    cmd.value = hp < hist.length - 1 ? hist[++hp] : (hp = hist.length, "");
  }
});
$("term").addEventListener("click", () => cmd.focus());

/* ── go ─────────────────────────────────────────────────── */
if (RM){ while (idx < L.length) emit(L[idx++]); finish(); }
else setTimeout(tick, 500);
